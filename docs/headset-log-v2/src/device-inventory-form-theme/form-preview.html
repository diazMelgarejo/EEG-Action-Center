<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Headset log preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Spectral:wght@300;400&display=swap" rel="stylesheet">
<style>
  /* Approximates the Google Form after the theme in THEME.md. Sample data only. */
  :root { --ivory: #FBF9F1; --pearl: #F1EEE6; --nacre: #DAD5C9; --oyster: #6E6A5F; --ink: #33322E; --card: #FFFEFA; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 16px 48px; background: var(--ivory); color: var(--ink); font: 400 15px/1.5 "Hanken Grotesk", Helvetica, Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; display: grid; gap: 12px; }
  .banner { display: block; width: 100%; border-radius: 8px; border: 1px solid var(--pearl); }
  .card { background: var(--card); border: 1px solid var(--nacre); border-radius: 8px; padding: 22px 24px; }
  h1 { margin: 0 0 6px; font: 300 34px/1.15 Spectral, Georgia, serif; letter-spacing: -.01em; }
  h2 { margin: 12px 0 0; font: 400 21px/1.3 Spectral, Georgia, serif; }
  .who { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--pearl); color: var(--oyster); font-size: 13px; }
  .q { margin: 0 0 12px; font-weight: 500; }
  .help { margin: -8px 0 12px; color: var(--oyster); font-size: 13px; }
  label { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  input[type=radio] { accent-color: var(--oyster); width: 17px; height: 17px; margin: 0; }
  select, input[type=text] { width: 100%; max-width: 300px; padding: 9px 10px; font: inherit; color: inherit; background: var(--ivory); border: 1px solid var(--nacre); border-radius: 4px; }
  .when { display: flex; flex-wrap: wrap; gap: 12px; }
  .when input { width: 150px; }
  select:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--oyster); outline-offset: 2px; }
  button { justify-self: start; padding: 10px 22px; font: 500 15px "Hanken Grotesk", Helvetica, sans-serif; color: #fff; background: var(--oyster); border: 0; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <img class="banner" src="form-header-1600x400.png" alt="A strand of pearls on ivory">
  <section class="card">
    <h1>Headset log</h1>
    <p style="margin:0">One entry for each move, at the moment it happens.</p>
    <p class="who">Signed in as a.person@example.org</p>
  </section>
  <section class="card">
    <p class="q">What happened? *</p>
    <label><input type="radio" name="a" checked> A headset went into a lab</label>
    <label><input type="radio" name="a"> A headset came out of a lab</label>
    <label><input type="radio" name="a"> A headset was repaired or a part changed</label>
  </section>
  <h2>Into a lab</h2>
  <section class="card">
    <p class="q">Which lab? *</p>
    <select aria-label="Which lab"><option>Lab 12 (1234)</option><option>Lab 13 (empty)</option></select>
  </section>
  <section class="card">
    <p class="q">Which headset went in? *</p>
    <select aria-label="Which headset"><option>5678 (Spare)</option><option>9012 (For repair)</option></select>
  </section>
  <section class="card">
    <p class="q">The headset already there goes to</p>
    <p class="help">Spare unless you choose For repair.</p>
    <label><input type="radio" name="b"> Spare</label>
    <label><input type="radio" name="b"> For repair</label>
  </section>
  <h2>When</h2>
  <section class="card">
    <p class="help" style="margin-top:0">Leave date and time blank if it is happening now.</p>
    <div class="when"><input type="text" aria-label="Date" placeholder="Date"><input type="text" aria-label="Time" placeholder="Time"></div>
  </section>
  <button type="button">Submit</button>
</main>
</body>
</html>
